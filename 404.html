*,*::before,*::after{box-sizing:border-box}
html{background:#0E0E0E}
body{margin:0;background:#0E0E0E;color:#fff;
font-family:'Nekst','Arial Narrow',Arial,Helvetica,sans-serif;
-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
img,svg,canvas{display:block;max-width:100%}
h1{margin:0}
p{margin:0}
.skip-link{position:absolute;top:8px;left:8px;z-index:100;padding:10px 18px;
border-radius:14px;background:#4BBCFC;color:#04121B;font-weight:700;
transform:translateY(-160%)}
.skip-link:focus-visible{transform:none}
:focus-visible{outline:2px solid #4BBCFC;outline-offset:3px;border-radius:4px}
.page-404 {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: #0E0E0E;
    overflow: hidden;
}

.space {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.space__canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.space__glow {
    position: absolute;
    left: 50%;
    top: 42%;
    width: min(900px, 90vw);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(75, 188, 252, .14) 0%, rgba(75, 188, 252, 0) 62%);
    animation: glowPulse 7s ease-in-out infinite;
}

@keyframes glowPulse {
    0%, 100% { opacity: .65; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
}

.error-header {
    position: relative;
    z-index: 2;
    padding: clamp(20px, 4vw, 40px) clamp(20px, 5vw, 60px);
}

.error-logo {
    display: inline-block;
    width: clamp(110px, 12vw, 150px);
}

.error-logo img {
    width: 100%;
    height: auto;
}

.error {
    position: relative;
    z-index: 2;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 2vw, 22px);
    padding: clamp(24px, 6vw, 80px) clamp(20px, 5vw, 60px) clamp(40px, 8vw, 90px);
    text-align: center;
}

.error__code {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.4vw, 18px);
    font-size: clamp(5rem, 17vw, 15rem);
    line-height: .82;
    font-weight: 700;
    letter-spacing: -.02em;
    transform: translate3d(var(--tx, 0), var(--ty, 0), 0);
    transition: transform .5s cubic-bezier(.22, .61, .36, 1);
}

.error__digit {
    background: linear-gradient(88.61deg, #737373 -30.22%, #D9D9D9 57.44%, #868686 131.14%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: digitFloat 6s ease-in-out infinite;
}

.error__digit:last-of-type {
    animation-delay: -3s;
}

@keyframes digitFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.error__planet {
    position: relative;
    display: inline-block;
    width: clamp(4rem, 13.6vw, 12rem);
    aspect-ratio: 1;
    animation: planetFloat 6s ease-in-out infinite -1.5s;
}

@keyframes planetFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
}

.error__core {
    position: absolute;
    inset: 14%;
    border-radius: 50%;
    background:
        radial-gradient(circle at 32% 30%, #6FA8D8 0%, #24425F 42%, #0B1622 72%, #060B12 100%);
    box-shadow:
        inset -12px -10px 34px rgba(0, 0, 0, .75),
        0 0 44px rgba(75, 188, 252, .28);
}

.error__core::after {
    content: '';
    position: absolute;
    inset: -6%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, rgba(140, 205, 255, 0) 58%, rgba(140, 205, 255, .35) 72%, rgba(140, 205, 255, 0) 82%);
}

.error__ring {
    position: absolute;
    inset: 2%;
    border-radius: 50%;
    border: 2px solid rgba(140, 205, 255, .38);
    border-right-color: transparent;
    border-bottom-color: transparent;
    animation: ringSpin 9s linear infinite;
}

@keyframes ringSpin {
    to { transform: rotate(360deg); }
}

.error__title {
    font-size: clamp(1.35rem, 3.4vw, 2.6rem);
    line-height: 1.05;
    text-transform: uppercase;
    text-wrap: balance;
}

.error__text {
    max-width: 46ch;
    color: rgba(255, 255, 255, .62);
    font-size: clamp(.95rem, 1.3vw, 1.1rem);
    text-wrap: pretty;
}

.error__actions {
    margin-top: clamp(10px, 1.6vw, 20px);
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
}

.error__meta {
    margin-top: clamp(16px, 3vw, 34px);
    font-size: .72rem;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .3);
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding-inline: 30px;
    border-radius: 14px;
    font-size: .82rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    transition: background .3s cubic-bezier(.22, .61, .36, 1),
        border-color .3s cubic-bezier(.22, .61, .36, 1),
        transform .3s cubic-bezier(.22, .61, .36, 1);
}

.btn:hover {
    transform: translateY(-2px);
}

.btn--primary {
    background: #4BBCFC;
    color: #04121B;
    font-weight: 700;
}

.btn--primary:hover {
    background: #7CD0FF;
}

.btn--ghost {
    border: 1px solid rgba(255, 255, 255, .22);
    color: #fff;
}

.btn--ghost:hover {
    border-color: #fff;
}

@media (prefers-reduced-motion: reduce) {

    .space__glow,
    .error__digit,
    .error__planet,
    .error__ring {
        animation: none;
    }

    .error__code {
        transition: none;
    }
}


.page-404 {
    background: #0E0E0E !important;
}

.page-404 .loader,
.page-404 .scroll-video,
.page-404 .scroll-hint,
.page-404 .stage {
    display: none !important;
}

.page-404 .space__canvas {
    opacity: .9;
}

.error__code {
    will-change: transform;
}

.error__planet {
    filter: drop-shadow(0 24px 60px rgba(75, 188, 252, .22));
}

.error__core {
    overflow: hidden;
}

.error__core::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
        radial-gradient(circle at 22% 18%, rgba(255, 255, 255, .28) 0%, rgba(255, 255, 255, 0) 34%),
        radial-gradient(circle at 68% 74%, rgba(10, 24, 40, .55) 0%, rgba(10, 24, 40, 0) 46%);
}

.error__ring::after {
    content: '';
    position: absolute;
    inset: -9%;
    border-radius: 50%;
    border: 1px solid rgba(140, 205, 255, .16);
    border-left-color: transparent;
    border-top-color: transparent;
    animation: ringSpin 14s linear infinite reverse;
}

.error__actions .btn {
    position: relative;
    overflow: hidden;
}

.error__actions .btn--primary::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 20%, rgba(255, 255, 255, .55) 50%, transparent 80%);
    transform: translateX(-120%);
    animation: sheen 4.5s ease-in-out infinite;
}

@keyframes sheen {
    0%, 62% { transform: translateX(-120%); }
    82%, 100% { transform: translateX(120%); }
}

@media (prefers-reduced-motion: reduce) {
    .error__actions .btn--primary::after,
    .error__ring::after {
        animation: none;
    }
}
</style>

            </span>
            <span class="error__digit">4</span>
        </p>

        <h1 class="error__title">Страница ушла с орбиты</h1>

        <p class="error__text">
            Адрес не существует или материал перенесён. Вернитесь на главную — там всё на своих местах.
        </p>

        <div class="error__actions">
            <a class="btn btn--primary" href="./">На главную</a>
            <a class="btn btn--ghost" href="./#directions">Наши направления</a>
        </div>

        <p class="error__meta">Код ошибки: 404 · Not Found</p>
    </main>

    <script>const STAR_LAYERS = [
    { count: 90, size: [0.4, 1.0], alpha: [0.15, 0.4], speed: 0.004 },
    { count: 55, size: [0.8, 1.6], alpha: [0.3, 0.65], speed: 0.011 },
    { count: 18, size: [1.3, 2.4], alpha: [0.5, 0.95], speed: 0.02 }
];

const random = (min, max) => min + Math.random() * (max - min);

document.documentElement.classList.remove('no-js');

const canvas = document.querySelector('[data-space]');
const tilt = document.querySelector('[data-tilt]');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

if (canvas) {
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let stars = [];
    let comets = [];
    let raf = 0;
    let last = performance.now();
    let nextComet = last + random(1200, 3200);

    const build = () => {
        stars = [];
        STAR_LAYERS.forEach((layer, index) => {
            const scale = (width * height) / (1440 * 900);
            const count = Math.round(layer.count * Math.max(scale, 0.4));
            for (let i = 0; i < count; i += 1) {
                stars.push({
                    layer: index,
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: random(layer.size[0], layer.size[1]),
                    a: random(layer.alpha[0], layer.alpha[1]),
                    phase: Math.random() * Math.PI * 2
                });
            }
        });
    };

    const resize = () => {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = rect.width;
        height = rect.height;
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        build();
    };

    const spawnComet = () => {
        const fromLeft = Math.random() > 0.4;
        comets.push({
            x: fromLeft ? -140 : width + 140,
            y: random(-0.05, 0.6) * height,
            vx: (fromLeft ? 1 : -1) * random(0.34, 0.62),
            vy: random(0.14, 0.3),
            len: random(140, 300),
            size: random(1.1, 2.2),
            life: 0,
            max: random(2800, 4600)
        });
    };

    const drawComet = (comet) => {
        const fade = comet.life < 420
            ? comet.life / 420
            : comet.life > comet.max - 700
                ? Math.max(0, (comet.max - comet.life) / 700)
                : 1;

        const angle = Math.atan2(comet.vy, comet.vx);
        const tailX = comet.x - Math.cos(angle) * comet.len;
        const tailY = comet.y - Math.sin(angle) * comet.len;

        const grad = ctx.createLinearGradient(comet.x, comet.y, tailX, tailY);
        grad.addColorStop(0, `rgba(255,255,255,${0.8 * fade})`);
        grad.addColorStop(0.32, `rgba(160,214,255,${0.28 * fade})`);
        grad.addColorStop(1, 'rgba(75,188,252,0)');

        ctx.strokeStyle = grad;
        ctx.lineWidth = comet.size;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(comet.x, comet.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();

        const glow = ctx.createRadialGradient(comet.x, comet.y, 0, comet.x, comet.y, comet.size * 8);
        glow.addColorStop(0, `rgba(255,255,255,${0.9 * fade})`);
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(comet.x, comet.y, comet.size * 8, 0, Math.PI * 2);
        ctx.fill();
    };

    const frame = (now) => {
        const dt = Math.min(now - last || 16, 48);
        last = now;
        ctx.clearRect(0, 0, width, height);

        stars.forEach((star) => {
            const layer = STAR_LAYERS[star.layer];
            star.x += layer.speed * dt;
            if (star.x > width + 2) star.x = -2;
            star.phase += 0.0009 * dt;
            const alpha = star.a * (0.7 + Math.sin(star.phase) * 0.3);
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
            ctx.fill();
        });

        if (now > nextComet && comets.length < 2) {
            spawnComet();
            nextComet = now + random(3600, 9000);
        }

        comets = comets.filter((comet) => {
            comet.x += comet.vx * dt;
            comet.y += comet.vy * dt;
            comet.life += dt;
            drawComet(comet);
            return comet.life < comet.max && comet.x > -420 && comet.x < width + 420;
        });

        raf = requestAnimationFrame(frame);
    };

    const start = () => {
        if (raf) return;
        last = performance.now();
        raf = requestAnimationFrame(frame);
    };

    const stop = () => {
        cancelAnimationFrame(raf);
        raf = 0;
    };

    let timer = 0;
    window.addEventListener('resize', () => {
        clearTimeout(timer);
        timer = setTimeout(resize, 180);
    });

    document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));

    resize();

    if (reduceMotion) {
        ctx.clearRect(0, 0, width, height);
        stars.forEach((star) => {
            ctx.fillStyle = `rgba(255,255,255,${star.a})`;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
            ctx.fill();
        });
    } else {
        start();
    }
}

if (tilt && !reduceMotion && window.matchMedia('(pointer: fine)').matches) {
    let ticking = false;

    window.addEventListener('pointermove', (event) => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
            ticking = false;
            const dx = (event.clientX / window.innerWidth - 0.5) * 2;
            const dy = (event.clientY / window.innerHeight - 0.5) * 2;
            tilt.style.setProperty('--tx', (dx * 14).toFixed(1) + 'px');
            tilt.style.setProperty('--ty', (dy * 10).toFixed(1) + 'px');
        });
    }, { passive: true });
}
</script>
</body>
