<!DOCTYPE html>
<html lang="ru" class="no-js">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0E0E0E">
    <meta name="color-scheme" content="dark">

    <title>404 — страница ушла с орбиты | КОМЕТА</title>
    <meta name="description" content="Страница не найдена. Вернитесь на главную сайта Web3-агентства КОМЕТА.">
    <meta name="robots" content="noindex, follow">

    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <link rel="preload" href="/assets/fonts/Nekst-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/404.css">
</head>

<body class="page-404">
    <a class="skip-link" href="#main">Перейти к содержимому</a>

    <div class="space" aria-hidden="true">
        <canvas class="space__canvas" data-space></canvas>
        <span class="space__glow"></span>
    </div>

    <header class="error-header">
        <a class="error-logo" href="/" aria-label="КОМЕТА — на главную">
            <picture>
                <source srcset="/assets/images/kometa.webp" type="image/webp">
                <img src="/assets/images/kometa.png" width="700" height="159" alt="КОМЕТА">
            </picture>
        </a>
    </header>

    <main class="error" id="main">
        <p class="error__code" data-tilt>
            <span class="error__digit">4</span>
            <span class="error__planet" role="img" aria-label="0">
                <span class="error__ring"></span>
                <span class="error__core"></span>
            </span>
            <span class="error__digit">4</span>
        </p>

        <h1 class="error__title">Страница ушла с орбиты</h1>

        <p class="error__text">
            Адрес не существует или материал перенесён. Вернитесь на главную — там всё на своих местах.
        </p>

        <div class="error__actions">
            <a class="btn btn--primary" href="/">На главную</a>
            <a class="btn btn--ghost" href="/#directions">Наши направления</a>
        </div>

        <p class="error__meta">Код ошибки: 404 · Not Found</p>
    </main>

    <script type="module" src="/assets/js/error-page.js"></script>
</body>

</html>
